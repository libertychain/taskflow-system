<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Projetos - TechAlves Soluções</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .sidebar-item {
            transition: all 0.3s ease;
        }
        
        .sidebar-item:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateX(4px);
        }
        
        .sidebar-item.active {
            background: rgba(59, 130, 246, 0.2);
            border-right: 3px solid #3b82f6;
        }
        
        .project-card {
            transition: all 0.3s ease;
        }
        
        .project-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .progress-bar {
            background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 9999px;
            height: 8px;
            transition: width 0.3s ease;
        }
        
        .status-active { border-left: 4px solid #3b82f6; }
        .status-completed { border-left: 4px solid #10b981; }
        .status-cancelled { border-left: 4px solid #ef4444; }
        .status-on-hold { border-left: 4px solid #f59e0b; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Sidebar -->
    <div class="fixed left-0 top-0 h-full w-64 bg-white shadow-lg z-10">
        <div class="p-6">
            <div class="flex items-center space-x-3 mb-8">
                <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                    <i class="fas fa-tasks text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-gray-800">TechAlves</h1>
                    <p class="text-xs text-gray-500">Soluções</p>
                </div>
            </div>
            
            <nav class="space-y-2">
                <a href="dashboard.html" class="sidebar-item flex items-center space-x-3 p-3 rounded-lg text-gray-700">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="tasks.html" class="sidebar-item flex items-center space-x-3 p-3 rounded-lg text-gray-700">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Tarefas</span>
                </a>
                <a href="projects.html" class="sidebar-item active flex items-center space-x-3 p-3 rounded-lg text-gray-700">
                    <i class="fas fa-project-diagram"></i>
                    <span>Projetos</span>
                </a>
                <a href="#" onclick="logout()" class="sidebar-item flex items-center space-x-3 p-3 rounded-lg text-red-600">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sair</span>
                </a>
            </nav>
        </div>
        
        <!-- User Info -->
        <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-gray-200">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                    <span id="userInitials" class="text-white font-semibold text-sm">US</span>
                </div>
                <div>
                    <p id="userName" class="font-medium text-gray-800 text-sm">Usuário</p>
                    <p id="userRole" class="text-xs text-gray-500">Role</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Main Content -->
    <div class="ml-64 p-8">
        
        <!-- Header -->
        <div class="mb-8 fade-in">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Gestão de Projetos</h1>
                    <p class="text-gray-600 mt-1">Gerencie e acompanhe seus projetos</p>
                </div>
                <button 
                    onclick="openProjectModal()" 
                    class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg font-semibold transition-colors"
                >
                    <i class="fas fa-plus mr-2"></i>
                    Novo Projeto
                </button>
            </div>
        </div>
        
        <!-- Filters -->
        <div class="bg-white rounded-xl p-6 shadow-sm mb-6 fade-in">
            <div class="flex flex-wrap gap-4">
                <div class="flex-1 min-w-48">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por Status</label>
                    <select id="statusFilter" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Todos</option>
                        <option value="ACTIVE">Ativos</option>
                        <option value="COMPLETED">Concluídos</option>
                        <option value="CANCELLED">Cancelados</option>
                        <option value="ON_HOLD">Em Espera</option>
                    </select>
                </div>
                
                <div class="flex-1 min-w-48">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Buscar</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Buscar projetos..."
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    >
                </div>
            </div>
        </div>
        
        <!-- Projects Grid -->
        <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 fade-in">
            <!-- Projects will be loaded here -->
            <div class="col-span-full text-center py-12 text-gray-500">
                <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                <p>Carregando projetos...</p>
            </div>
        </div>
    </div>
    
    <!-- Project Modal -->
    <div id="projectModal" class="modal">
        <div class="bg-white rounded-xl p-8 max-w-2xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 id="modalTitle" class="text-2xl font-bold text-gray-800">Novo Projeto</h2>
                <button onclick="closeProjectModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <form id="projectForm" class="space-y-6">
                <input type="hidden" id="projectId">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Nome do Projeto *</label>
                    <input 
                        type="text" 
                        id="projectName" 
                        required
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Digite o nome do projeto"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
                    <textarea 
                        id="projectDescription" 
                        rows="4"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        placeholder="Descreva o projeto..."
                    ></textarea>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data de Início</label>
                        <input 
                            type="date" 
                            id="projectStartDate"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Data de Término</label>
                        <input 
                            type="date" 
                            id="projectEndDate"
                            class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                        >
                    </div>
                </div>
                
                <div class="flex justify-end space-x-4">
                    <button 
                        type="button" 
                        onclick="closeProjectModal()"
                        class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-colors"
                    >
                        Cancelar
                    </button>
                    <button 
                        type="submit"
                        class="px-6 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-semibold transition-colors"
                    >
                        <span id="submitText">Criar Projeto</span>
                        <i id="submitSpinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Project Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="bg-white rounded-xl p-8 max-w-4xl w-full mx-4 max-h-96 overflow-y-auto">
            <div class="flex items-center justify-between mb-6">
                <h2 id="detailsTitle" class="text-2xl font-bold text-gray-800">Detalhes do Projeto</h2>
                <button onclick="closeDetailsModal()" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div id="projectDetails" class="space-y-6">
                <!-- Project details will be loaded here -->
            </div>
        </div>
    </div>
    
    <script>
        // Configuração do Axios
        const api = axios.create({
            baseURL: 'http://localhost:8080',
            headers: {
                'Content-Type': 'application/json'
            }
        });
        
        let allProjects = [];
        let currentEditingProject = null;
        
        // Verificar autenticação
        function checkAuth() {
            const sessionId = localStorage.getItem('sessionId');
            if (!sessionId) {
                window.location.href = 'index.html';
                return false;
            }
            return sessionId;
        }
        
        // Carregar dados do usuário
        function loadUserInfo() {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.name) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('userRole').textContent = user.role;
                document.getElementById('userInitials').textContent = 
                    user.name.split(' ').map(n => n[0]).join('').toUpperCase();
            }
        }
        
        // Carregar projetos
        async function loadProjects() {
            const sessionId = checkAuth();
            if (!sessionId) return;
            
            try {
                const response = await api.get('/api/projects', {
                    headers: {
                        'Authorization': `Bearer ${sessionId}`
                    }
                });
                
                allProjects = response.data;
                renderProjects();
                
            } catch (error) {
                console.error('Erro ao carregar projetos:', error);
                showError('Erro ao carregar projetos');
            }
        }
        
        // Renderizar projetos
        function renderProjects() {
            const statusFilter = document.getElementById('statusFilter').value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            let filteredProjects = allProjects;
            
            // Aplicar filtros
            if (statusFilter) {
                filteredProjects = filteredProjects.filter(project => project.status === statusFilter);
            }
            
            if (searchTerm) {
                filteredProjects = filteredProjects.filter(project => 
                    project.name.toLowerCase().includes(searchTerm) ||
                    project.description.toLowerCase().includes(searchTerm)
                );
            }
            
            const projectsGrid = document.getElementById('projectsGrid');
            
            if (filteredProjects.length === 0) {
                projectsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-gray-500">
                        <i class="fas fa-project-diagram text-4xl mb-4"></i>
                        <p>Nenhum projeto encontrado</p>
                    </div>
                `;
                return;
            }
            
            projectsGrid.innerHTML = filteredProjects.map(project => `
                <div class="project-card bg-white rounded-xl shadow-sm status-${project.status.toLowerCase()}">
                    <div class="p-6">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex-1">
                                <h3 class="text-lg font-semibold text-gray-800 mb-2">${project.name}</h3>
                                <p class="text-sm text-gray-600 line-clamp-2">${project.description || 'Sem descrição'}</p>
                            </div>
                            <div class="flex space-x-1 ml-4">
                                <button onclick="editProject(${project.id})" class="text-blue-500 hover:text-blue-700 p-1">
                                    <i class="fas fa-edit text-sm"></i>
                                </button>
                                <button onclick="deleteProject(${project.id})" class="text-red-500 hover:text-red-700 p-1">
                                    <i class="fas fa-trash text-sm"></i>
                                </button>
                            </div>
                        </div>
                        
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <span class="px-2 py-1 text-xs rounded-full ${getStatusBadgeColor(project.status)}">
                                    ${getStatusText(project.status)}
                                </span>
                                <div class="text-xs text-gray-500">
                                    ${project.taskCount || 0} tarefas
                                </div>
                            </div>
                            
                            ${project.startDate || project.endDate ? `
                                <div class="text-xs text-gray-600 space-y-1">
                                    ${project.startDate ? `<div><i class="fas fa-play mr-1"></i>Início: ${new Date(project.startDate).toLocaleDateString('pt-BR')}</div>` : ''}
                                    ${project.endDate ? `<div><i class="fas fa-flag-checkered mr-1"></i>Término: ${new Date(project.endDate).toLocaleDateString('pt-BR')}</div>` : ''}
                                </div>
                            ` : ''}
                            
                            <div class="pt-3 border-t border-gray-100">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-xs text-gray-600">Progresso</span>
                                    <span class="text-xs text-gray-600">${Math.min(project.taskCount || 0, 100)}%</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="progress-bar" style="width: ${Math.min(project.taskCount || 0, 100)}%"></div>
                                </div>
                            </div>
                            
                            <div class="flex space-x-2 pt-3">
                                <button 
                                    onclick="viewProjectDetails(${project.id})" 
                                    class="flex-1 bg-blue-50 hover:bg-blue-100 text-blue-600 text-sm py-2 px-3 rounded-lg transition-colors"
                                >
                                    <i class="fas fa-eye mr-1"></i>
                                    Ver Detalhes
                                </button>
                                <select 
                                    onchange="updateProjectStatus(${project.id}, this.value)"
                                    class="text-xs p-2 border border-gray-300 rounded focus:ring-1 focus:ring-blue-500"
                                >
                                    <option value="ACTIVE" ${project.status === 'ACTIVE' ? 'selected' : ''}>Ativo</option>
                                    <option value="COMPLETED" ${project.status === 'COMPLETED' ? 'selected' : ''}>Concluído</option>
                                    <option value="CANCELLED" ${project.status === 'CANCELLED' ? 'selected' : ''}>Cancelado</option>
                                    <option value="ON_HOLD" ${project.status === 'ON_HOLD' ? 'selected' : ''}>Em Espera</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        // Modal functions
        function openProjectModal(project = null) {
            currentEditingProject = project;
            const modal = document.getElementById('projectModal');
            const modalTitle = document.getElementById('modalTitle');
            const submitText = document.getElementById('submitText');
            
            if (project) {
                modalTitle.textContent = 'Editar Projeto';
                submitText.textContent = 'Atualizar Projeto';
                
                // Preencher formulário
                document.getElementById('projectId').value = project.id;
                document.getElementById('projectName').value = project.name;
                document.getElementById('projectDescription').value = project.description || '';
                document.getElementById('projectStartDate').value = project.startDate || '';
                document.getElementById('projectEndDate').value = project.endDate || '';
            } else {
                modalTitle.textContent = 'Novo Projeto';
                submitText.textContent = 'Criar Projeto';
                document.getElementById('projectForm').reset();
            }
            
            modal.classList.add('show');
        }
        
        function closeProjectModal() {
            document.getElementById('projectModal').classList.remove('show');
            currentEditingProject = null;
        }
        
        function closeDetailsModal() {
            document.getElementById('detailsModal').classList.remove('show');
        }
        
        // CRUD operations
        async function saveProject(event) {
            event.preventDefault();
            
            const sessionId = checkAuth();
            if (!sessionId) return;
            
            const projectId = document.getElementById('projectId').value;
            const projectData = {
                name: document.getElementById('projectName').value,
                description: document.getElementById('projectDescription').value,
                startDate: document.getElementById('projectStartDate').value || null,
                endDate: document.getElementById('projectEndDate').value || null
            };
            
            const submitText = document.getElementById('submitText');
            const submitSpinner = document.getElementById('submitSpinner');
            
            submitText.textContent = projectId ? 'Atualizando...' : 'Criando...';
            submitSpinner.classList.remove('hidden');
            
            try {
                if (projectId) {
                    // Atualizar projeto
                    await api.put(`/api/projects/${projectId}`, projectData, {
                        headers: {
                            'Authorization': `Bearer ${sessionId}`
                        }
                    });
                } else {
                    // Criar novo projeto
                    await api.post('/api/projects', projectData, {
                        headers: {
                            'Authorization': `Bearer ${sessionId}`
                        }
                    });
                }
                
                closeProjectModal();
                loadProjects();
                
            } catch (error) {
                console.error('Erro ao salvar projeto:', error);
                showError('Erro ao salvar projeto');
            } finally {
                submitText.textContent = projectId ? 'Atualizar Projeto' : 'Criar Projeto';
                submitSpinner.classList.add('hidden');
            }
        }
        
        async function editProject(projectId) {
            const project = allProjects.find(p => p.id === projectId);
            if (project) {
                openProjectModal(project);
            }
        }
        
        async function deleteProject(projectId) {
            if (!confirm('Tem certeza que deseja excluir este projeto? Todas as tarefas associadas serão perdidas.')) {
                return;
            }
            
            const sessionId = checkAuth();
            if (!sessionId) return;
            
            try {
                await api.delete(`/api/projects/${projectId}`, {
                    headers: {
                        'Authorization': `Bearer ${sessionId}`
                    }
                });
                
                loadProjects();
                
            } catch (error) {
                console.error('Erro ao excluir projeto:', error);
                showError('Erro ao excluir projeto');
            }
        }
        
        async function updateProjectStatus(projectId, newStatus) {
            const sessionId = checkAuth();
            if (!sessionId) return;
            
            try {
                await api.patch(`/api/projects/${projectId}/status`, {
                    status: newStatus
                }, {
                    headers: {
                        'Authorization': `Bearer ${sessionId}`
                    }
                });
                
                loadProjects();
                
            } catch (error) {
                console.error('Erro ao atualizar status:', error);
                showError('Erro ao atualizar status');
            }
        }
        
        async function viewProjectDetails(projectId) {
            const sessionId = checkAuth();
            if (!sessionId) return;
            
            try {
                const response = await api.get(`/api/projects/${projectId}`, {
                    headers: {
                        'Authorization': `Bearer ${sessionId}`
                    }
                });
                
                const project = response.data;
                showProjectDetails(project);
                
            } catch (error) {
                console.error('Erro ao carregar detalhes do projeto:', error);
                showError('Erro ao carregar detalhes do projeto');
            }
        }
        
        function showProjectDetails(project) {
            const modal = document.getElementById('detailsModal');
            const detailsTitle = document.getElementById('detailsTitle');
            const projectDetails = document.getElementById('projectDetails');
            
            detailsTitle.textContent = project.name;
            
            projectDetails.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-4">
                        <div>
                            <h4 class="font-semibold text-gray-800 mb-2">Informações Básicas</h4>
                            <div class="space-y-2 text-sm">
                                <div><strong>Status:</strong> <span class="px-2 py-1 text-xs rounded-full ${getStatusBadgeColor(project.status)}">${getStatusText(project.status)}</span></div>
                                <div><strong>Criado por:</strong> ${project.createdBy || 'Sistema'}</div>
                                <div><strong>Data de criação:</strong> ${new Date(project.createdAt).toLocaleDateString('pt-BR')}</div>
                            </div>
                        </div>
                        
                        ${project.description ? `
                            <div>
                                <h4 class="font-semibold text-gray-800 mb-2">Descrição</h4>
                                <p class="text-sm text-gray-600">${project.description}</p>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <h4 class="font-semibold text-gray-800 mb-2">Datas</h4>
                            <div class="space-y-2 text-sm">
                                ${project.startDate ? `<div><strong>Início:</strong> ${new Date(project.startDate).toLocaleDateString('pt-BR')}</div>` : ''}
                                ${project.endDate ? `<div><strong>Término:</strong> ${new Date(project.endDate).toLocaleDateString('pt-BR')}</div>` : ''}
                            </div>
                        </div>
                        
                        <div>
                            <h4 class="font-semibold text-gray-800 mb-2">Estatísticas</h4>
                            <div class="bg-gray-50 rounded-lg p-4">
                                <div class="text-2xl font-bold text-blue-600">${project.taskCount || 0}</div>
                                <div class="text-sm text-gray-600">Tarefas associadas</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.add('show');
        }
        
        // Funções auxiliares
        function getStatusBadgeColor(status) {
            const colors = {
                'ACTIVE': 'bg-blue-100 text-blue-800',
                'COMPLETED': 'bg-green-100 text-green-800',
                'CANCELLED': 'bg-red-100 text-red-800',
                'ON_HOLD': 'bg-yellow-100 text-yellow-800'
            };
            return colors[status] || 'bg-gray-100 text-gray-800';
        }
        
        function getStatusText(status) {
            const texts = {
                'ACTIVE': 'Ativo',
                'COMPLETED': 'Concluído',
                'CANCELLED': 'Cancelado',
                'ON_HOLD': 'Em Espera'
            };
            return texts[status] || status;
        }
        
        function showError(message) {
            alert(message); // Em produção, usar uma notificação melhor
        }
        
        function logout() {
            const sessionId = localStorage.getItem('sessionId');
            if (sessionId) {
                api.post('/api/auth/logout', {}, {
                    headers: {
                        'Authorization': `Bearer ${sessionId}`
                    }
                }).finally(() => {
                    localStorage.clear();
                    window.location.href = 'index.html';
                });
            } else {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        }
        
        // Event listeners
        document.getElementById('statusFilter').addEventListener('change', renderProjects);
        document.getElementById('searchInput').addEventListener('input', renderProjects);
        document.getElementById('projectForm').addEventListener('submit', saveProject);
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            loadUserInfo();
            loadProjects();
            
            // Animações de entrada
            const elements = document.querySelectorAll('.fade-in');
            elements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    el.style.transition = 'all 0.6s ease-out';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
